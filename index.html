<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Videojuegos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>Agrega tu videojuego</h1>
        <input type="number" name="ID" id="ID" placeholder="ID (Identificador único)" />
        <input type="text" id="titulo" placeholder="Título" />
        <input type="text" id="plataforma" placeholder="Plataforma" />
        <input type="text" id="genero" placeholder="Género" />   
        <input type="number" name="" id="precio" placeholder="Ingresa el precio">   
        <input type="url" id="portada" placeholder="URL de la portada" >
        <button id="agregar">Agregar</button>
    </div>

    <div id="catalogo" class="container"></div>

    <script src="app.js" type="module"></script>
</body>
</html>
